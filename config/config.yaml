# IterRet Configuration — override CLI: python scripts/train.py llm.type=mock

# LLM Configuration
llm:
  type: openai_compatible  # mock | openai_compatible (vLLM/LM Studio/Ollama)
  base_url: null           # env: ITERRET_LLM_BASE_URL; defaults to vLLM localhost:8000
  model: null              # env: ITERRET_LLM_MODEL; defaults to gpt-4
  api_key: not-needed      # env: ITERRET_LLM_API_KEY (for hosted endpoints)
  max_tokens: 1024

# Experiment Configuration (maps to run_locomo_eval.py args)
experiment:
  locomo_path: IterRet/data/locomo10.json  # LoCoMo dataset (null = auto-search)
  bootstrap_fraction: 0.1                  # fraction of data for memory building
  max_iterations: 5                        # DEFAULT_MAX_ITERATIONS from iterret.state
  categories: [1, 2, 3, 4]                # eval categories (1-4 typical; 5 = adversarial)
  max_turns_per_conversation: null
  max_chars_per_call: 4000                # memory_builder.DEFAULT_MAX_CHARS_PER_CALL
  bootstrap_questions_per_conv: 10
  max_questions_per_conversation: null
  max_eval_conversations: null
  skip_llm_judge: false
  save_graphs_dir: null

# Logging Configuration (consumed by iterret.exp_logging.setup_logging)
logging:
  console_level: INFO
  file_level: DEBUG
  json_log_file: run.jsonl

# Checkpoint Configuration (consumed by iterret.experiment.CheckpointManager)
checkpoint:
  root: ${oc.env:ITERRET_CHECKPOINT_ROOT,/mnt/ssd/users/durgesh/iterret/checkpoints}
  load_dir: null              # load existing checkpoint to resume/evaluate
  save_every_n_conversations: 0  # 0 = save only at bootstrap end

# Run Configuration
run_name: null  # wandb run name & checkpoint dir; null = Hydra timestamp
seed: 0

# WandB Configuration
wandb:
  enabled: true  # requires WANDB_API_KEY in .env
  project: iterret
  entity: ${oc.env:WANDB_ENTITY,null}
  mode: online       # online | offline | disabled
  tags: []
  group: null

# Hydra Configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    chdir: false
